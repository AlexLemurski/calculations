version: '3.8'

services:

  backend:
    image: calculations-app:0.0.1
    container_name: backend
    ports:
      - "8050:8196" # внешний порт 8050, внутри 8196
    volumes:
      - "C:/Users/user/Desktop/files:/app/resource"
      - "./logs/backend:/var/log/backend" # лог-файлы
    depends_on:
      - postgres
    environment:
      SERVER_PORT: 8196
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/calculations}
      SPRING_DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-admin}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - calculations_network

  postgres:
    image: postgres:16.3-alpine3.20
    container_name: postgres
    environment:
      POSTGRES_DB: calculations
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backups  # место для бэкапов
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "3"
    networks:
      - calculations_network

  pgadmin:
    image: dpage/pgadmin4:8.8
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - calculations_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - calculations_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - calculations_network

  backup:
    image: appropriate/curl:latest
    container_name: pg_backup
    depends_on:
      - postgres
    volumes:
      - ./backup:/backups
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=calculations
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
    command: >
      sh -c '
        while true; do
          timestamp=$(date +"%Y%m%d%H%M");
          PGPASSWORD=$POSTGRES_PASSWORD pg_dump -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB > /backups/dump_$timestamp.sql;
          sleep 86400; # раз в сутки
        done
      '
    restart: always
    networks:
      - calculations_network

volumes:
  postgres_data:
  pgadmin_data:
  grafana_data:

networks:
  calculations_network: